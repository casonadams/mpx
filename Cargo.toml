[package]
name = "mpx"
version = "0.1.0"
edition = "2024"
authors = ["Cason Adams <casonadams@gmail.com>"]
description = "A simple, ultra-performant process and stream multiplexer in Rust"
license = "Apache-2.0"

[lib]
name = "mpx"
path = "src/lib.rs"

[[bin]]
name = "mpx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.8"
bytes = "1.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vte = "0.14"
crossterm = { version = "0.28", features = ["event-stream"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
