[package]
name = "mpx"
version = "0.1.2"
edition = "2024"
authors = ["Cason Adams <casonadams@gmail.com>"]
description = "A simple, ultra-performant process and stream multiplexer in Rust"
license = "Apache-2.0"
repository = "https://github.com/casonadams/mpx"
homepage = "https://casonadams.github.io/mpx/"
documentation = "https://docs.rs/mpx"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "tui", "mcp"]
categories = ["command-line-utilities", "development-tools", "asynchronous"]

[lib]
name = "mpx"
path = "src/lib.rs"

[[bin]]
name = "mpx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.9"
bytes = "1.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vte = "0.15"
crossterm = { version = "0.29", features = ["event-stream"] }
toml = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
